name: ecoweb

x-api-environment: &api-environment
  NODE_ENV: production
  PORT_SERVER: 3333
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGODB_URL: mongodb://mongodb:27017/${MONGODB_DATABASE:-ecoweb}?authSource=admin
  MONGODB_USERNAME: ${MONGODB_USERNAME:-ecoweb}
  MONGODB_PASSWORD: ${MONGODB_PASSWORD:-ecoweb_dev_password}
  MONGODB_AUTH_SOURCE: admin

services:
  mongodb:
    image: mongo:7.0.41
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ecoweb}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-ecoweb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-ecoweb_dev_password}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecoweb_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecoweb-api:local
    restart: unless-stopped
    init: true
    environment: *api-environment
    ports:
      - "${PORT_SERVER:-3333}:3333"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecoweb_network

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecoweb-api:local
    profiles: [tools]
    environment: *api-environment
    command: [npm, run, seed]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecoweb_network

volumes:
  mongodb_data:

networks:
  ecoweb_network:
    driver: bridge
